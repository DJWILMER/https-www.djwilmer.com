<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DJ WILMER</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,400;0,600;0,700;1,700&family=DM+Mono:wght@400;500&display=swap"
        rel="stylesheet" />

    <!-- Hoja de estilos externa -->
    <link rel="stylesheet" href="styles.css" />
</head>

<body>

    <!-- FONDO DINÁMICO (BLUR) -->
    <div id="bg-blur"></div>

    <!-- ===== HEADER ===== -->
    <header>
        <div class="clock-box">
            <span class="clock-date" id="clock-date">cargando...</span>
            <span class="clock-time" id="clock-time">00:00:00</span>
        </div>

        <button id="btn-theme" aria-label="Cambiar tema">
            <!-- Ícono Sol (modo oscuro activo) -->
            <svg id="icon-sun" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="4" />
                <line x1="12" y1="2" x2="12" y2="6" />
                <line x1="12" y1="18" x2="12" y2="22" />
                <line x1="4.93" y1="4.93" x2="7.76" y2="7.76" />
                <line x1="16.24" y1="16.24" x2="19.07" y2="19.07" />
                <line x1="2" y1="12" x2="6" y2="12" />
                <line x1="18" y1="12" x2="22" y2="12" />
                <line x1="4.93" y1="19.07" x2="7.76" y2="16.24" />
                <line x1="16.24" y1="7.76" x2="19.07" y2="4.93" />
            </svg>
            <!-- Ícono Luna (modo claro activo) -->
            <svg id="icon-moon" viewBox="0 0 24 24" style="display:none">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
            </svg>
        </button>
    </header>

    <!-- ===== CONTENIDO PRINCIPAL ===== -->
    <main>
        <h1 class="hero-title">DJ <span>WILMER</span></h1>

        <!-- CARÁTULA -->
        <div class="cover-card">
            <img src="https://i.ibb.co/mhw9LGh/DJ-WILMER-PNG-ORIGINAL.png" alt="Portada del álbum" />
            <div class="live-badge">
                <span class="live-dot"></span> EN VIVO
            </div>
        </div>

        <!-- INFORMACIÓN DE LA CANCIÓN -->
        <div class="track-info">
            <p class="track-artist">DJ WILMER </p>
            <h2 class="track-title">SONANDO TODA TU MUSICA </h2>
        </div>
    </main>

    <!-- ===== VISUALIZADOR DE ONDAS ===== -->
    <svg class="waves-bg" preserveAspectRatio="none" viewBox="0 0 1440 320">
        <path class="wave1" fill="#6366f1" fill-opacity="0.45"
            d="M0,160L48,176C96,192,192,224,288,224C384,224,480,192,576,165.3C672,139,768,117,864,128C960,139,1056,181,1152,186.7C1248,192,1344,160,1392,144L1440,128L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z" />
        <path class="wave2" fill="#a855f7" fill-opacity="0.4"
            d="M0,224L48,213.3C96,203,192,181,288,181.3C384,181,480,203,576,224C672,245,768,267,864,250.7C960,235,1056,181,1152,165.3C1248,149,1344,171,1392,181.3L1440,192L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z" />
    </svg>

    <!-- ===== BARRA DE REDES SOCIALES ===== -->
    <nav class="social-sidebar" aria-label="Redes sociales">
        <a href="https://web.facebook.com/DJCHOCHOBARWILMER" class="fb" aria-label="Facebook">
            <svg viewBox="0 0 24 24">
                <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z" />
            </svg>
        </a>
        <a href="https://www.instagram.com/wilmerdelgadocieza" class="ig" aria-label="Instagram">
            <svg viewBox="0 0 24 24">
                <rect x="2" y="2" width="20" height="20" rx="5" ry="5" />
                <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z" />
                <line x1="17.5" y1="6.5" x2="17.51" y2="6.5" />
            </svg>
        </a>
        <a href="https://wilmerdelgadocieza.blogspot.com/" class="tw" aria-label="Twitter / X">
            <svg viewBox="0 0 24 24">
                <path
                    d="M23 3a10.9 10.9 0 0 1-3.14 1.53 4.48 4.48 0 0 0-7.86 3v1A10.66 10.66 0 0 1 3 4s-4 9 5 13a11.64 11.64 0 0 1-7 2c9 5 20 0 20-11.5a4.5 4.5 0 0 0-.08-.83A7.72 7.72 0 0 0 23 3z" />
            </svg>
        </a>
        <a href="#" class="sh" aria-label="Compartir">
            <svg viewBox="0 0 24 24">
                <circle cx="18" cy="5" r="3" />
                <circle cx="6" cy="12" r="3" />
                <circle cx="18" cy="19" r="3" />
                <line x1="8.59" y1="13.51" x2="15.42" y2="17.49" />
                <line x1="15.41" y1="6.51" x2="8.59" y2="10.49" />
            </svg>
        </a>
    </nav>

    <!-- ===== BOTÓN CHAT ===== -->
    <button id="btn-chat" aria-label="Abrir chat">
        <svg viewBox="0 0 24 24">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
        </svg>
        <span>Chat</span>
    </button>

    <!-- ===== PLAYER FOOTER ===== -->
    <footer>
        <div class="player-inner">

            <!-- Info mini -->
            <div class="mini-info">
                <img src="https://i.ibb.co/mhw9LGh/DJ-WILMER-PNG-ORIGINAL.png" alt="Cover miniatura" />
                <div>
                    <h4>DJ WILMER</h4>
                    <div class="mini-live">
                        <span class="mini-live-dot"></span>
                        <span>EN VIVO</span>
                    </div>
                </div>
            </div>

            <!-- Botón Play / Pause central -->
            <button id="btn-play" aria-label="Reproducir / Pausar">
                <svg id="icon-play" viewBox="0 0 24 24">
                    <polygon points="5 3 19 12 5 21 5 3" />
                </svg>
                <svg id="icon-pause" viewBox="0 0 24 24" style="display:none">
                    <rect x="6" y="4" width="4" height="16" />
                    <rect x="14" y="4" width="4" height="16" />
                </svg>
            </button>

            <!-- Controles de volumen y extras -->
            <div class="vol-controls">

                <!-- Botón mute -->
                <button id="btn-mute" aria-label="Silenciar / Activar sonido">
                    <svg id="icon-vol" viewBox="0 0 24 24">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
                        <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
                    </svg>
                    <svg id="icon-mute" viewBox="0 0 24 24" style="display:none">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
                        <line x1="23" y1="9" x2="17" y2="15" />
                        <line x1="17" y1="9" x2="23" y2="15" />
                    </svg>
                </button>

                <!-- Slider de volumen -->
                <input type="range" id="volume-slider" min="0" max="100" value="80" aria-label="Control de volumen" />
                <span class="vol-pct" id="vol-pct">80%</span>

                <!-- Corazón -->
                <button class="heart-btn" aria-label="Me gusta">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
                    </svg>
                </button>

                <!-- Badges de tiendas de apps -->
                <div class="app-badges">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg"
                        alt="Disponible en Google Play" />
                    <img src="https://upload.wikimedia.org/wikipedia/commons/3/3c/Download_on_the_App_Store_Badge.svg"
                        alt="Descargar en App Store" />
                </div>

            </div><!-- /vol-controls -->
        </div><!-- /player-inner -->
    </footer>

    <!-- Script externo (al final del body para que el DOM esté listo) -->
    <script src="script.js"></script>
</body>

</html>
